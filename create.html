<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/globalStyle.css">

</head>

<body class="bg-light">

<!-- HEADER -->
<div class="container py-4">
  <a href="events.html" class="btn btn-outline-secondary mb-3">← Back to Events</a>

  <h1 class="fw-bold">Create a New Event</h1>
  <p class="text-muted">Fill in the details below</p>
</div>

<!-- FORM -->
<div class="container">
  <div class="card shadow-sm p-4">

    <form>

      <!-- Title -->
      <div class="mb-3">
        <label class="form-label">Event Title *</label>
        <input type="text" class="form-control" placeholder="Enter event title" required>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label class="form-label">Description *</label>
        <textarea class="form-control" rows="4" placeholder="Enter event description" required></textarea>
      </div>

      <!-- Category + Capacity -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Category *</label>
          <select class="form-select" required>
            <option disabled selected>Select category</option>
            <option>Workshop</option>
            <option>Seminar</option>
            <option>Sports</option>
            <option>Cultural</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Capacity *</label>
          <input type="number" class="form-control" placeholder="e.g. 50" required>
        </div>
      </div>

      <!-- Date + Time -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Date *</label>
          <input type="date" class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Time</label>
          <input type="time" class="form-control">
        </div>
      </div>

      <!-- Image -->
      <div class="mb-3">
        <label class="form-label">Image URL</label>
        <input type="url" class="form-control" placeholder="https://example.com/image.jpg">
      </div>

      <!-- Centered Publish Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success px-4">Publish Event</button>
      </div>

    </form>

  </div>
</div>

</body>
</html>
