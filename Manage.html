<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ROOM CSS File -->
    <link rel="stylesheet" href="css/room.css">
    <link rel="stylesheet" href="css/globalStyle.css">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-light">

    <!-- Main Content -->
    <div class="container mt-4">

        <!-- Rooms Table -->
        <div class="card p-3 shadow-sm mt-5 mb-3">
            <h4 class="card-title">Event Management</h4>

            <table class="table table-striped mt-3">
                <thead class="table-primary">
                    <tr>
                        <th>Event Name</th>
                        <th>Capacity</th>
                        <th>Catagory</th>
                        <th>Event State</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>AI & Robotics</td>
                        <td>48</td>
                        <td>Workshop</td>
                        <td class="text-success">Available</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>                        
                    </tr>

                    <tr>
                        <td>Sports Association</td>
                        <td>0</td>
                        <td>Sports</td>
                        <td class="text-danger">Closed</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>
                    </tr>

                    <tr>
                        <td>Coding Event</td>
                        <td>7</td>
                        <td>Seminar</td>
                        <td class="text-success">Available</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>
                    </tr>

                    <tr>
                        <td>World Ending</td>
                        <td>-</td>
                        <td>Extra</td>
                        <td class="text-danger">Occupied</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>
                    </tr>

                    <tr>
                        <td>Full marks</td>
                        <td>-</td>
                        <td>Extra</td>
                        <td class="text-danger">Occupied</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>
                    </tr>

                    <tr>
                        <td>Cooking Event</td>
                        <td>16</td>
                        <td>Sports</td>
                        <td class="text-success">Available</td>
                        <td><div class="btn btn-warning"><i class="fa-solid fa-pen"></i></div></td>
                        <td><div class="btn btn-danger"><i class="fa-sharp fa-solid fa-trash"></i></div></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- BACK BUTTON -->
        <div class="text-center my-4">
            <a href="events.html" class="btn btn-primary px-4">
                ← Back to Events
            </a>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
