<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/dashbord.css">
    
</head>

<body>
    <div class="sidebar">
        <div class="logo-name">BrandName</div>

        <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Messages</a></li>
            <li><a href="dashbord.html">Dashboard</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </div>

    <main class="main-content">
        
        <header class="navbar">
            <span>Dashboard User</span>
        </header>

        <section class="main-body">
            <h1>$ 628</h1>
            <p>Total Earning</p>
        </section>

        <div class="stats-grid">
            <div class="main-body small-card">
                <h1>2434</h1>
                <p>Shares</p>
            </div>
            <div class="main-body small-card">
                <h1>1259</h1>
                <p>Likes</p>
            </div>
            <div class="main-body small-card">
                <h1>8.5</h1>
                <p>Rating</p>
            </div>
        </div>

        <div class="main-body chart-container">
            <h2 style="font-size: 24px; margin-bottom: 30px;">Monthly Growth (CSS Chart)</h2>
            
            <div class="css-chart">
                <div class="bar-group">
                    <div class="bar" style="height: 40%;"></div>
                    <span>Jan</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 70%;"></div>
                    <span>Feb</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 50%;"></div>
                    <span>Mar</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 90%;"></div>
                    <span>Apr</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 65%;"></div>
                    <span>May</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 80%;"></div>
                    <span>Jun</span>
                </div>
            </div>
        </div>

    </main>

    
    
</body>
</html>
