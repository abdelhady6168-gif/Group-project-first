<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portal - Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/globalStyle.css">
</head>
<body class="d-flex align-items-center vh-100 bg-light">

    <div class="container-fluid px-5"> 
        <div class="row justify-content-center">
            <div class="col-md-11 col-lg-10"> 
                
                <div class="card px-5 py-3 border border-secondary-subtle shadow-none">
                    <form>
                        <h4 class="card-title mb-3 fw-bold">University Log-in Portal</h4>

                        <div class="mb-2">
                            <label class="form-label fw-bold small mb-1">User ID</label>
                            <input type="text" class="form-control py-2 shadow-none" placeholder="0000" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold small mb-1">Email</label>
                            <input type="email" class="form-control py-2 shadow-none" placeholder="name_id@limu.edu.ly" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold small mb-1">Password</label>
                            <input type="password" class="form-control py-2 shadow-none" placeholder="**********" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small mb-1">Role</label>
                            <select class="form-select py-2 arrow-left shadow-none">
                                <option value="" disabled selected> Select Role</option>
                                <option value="student">Student</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary text-center">LOG IN NOW</button>
                        </div>

                        <div class="text-center mt-3 pt-2 border-top">
                            <a href="dashboard.html" class="text-muted text-decoration-none small">
                                Skip Login and Continue as Guest <i class="bi bi-arrow-right-short"></i>
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
    
</body>
</html>
