<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Management System</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="css/indexCss.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar" style="border: 5px solid black; border-right:5px solid black; border-bottom:5px solid black;border-bottom-right-radius:10px;border-top-right-radius: 10px;">
    <div class="logo-name">BrandName</div>

    <ul class="nav-list">
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Analytics</a></li>
        <li><a href="#">Messages</a></li>
        <li><a href="#">Settings</a></li>
        <li><a href="#">Logout</a></li>
    </ul>
</div>

<!-- Main Content -->
    <!-- Main Content -->
    <div class="container mt-4">

        <h1 class="mb-3">Room Inventory</h1>

        <!-- Add Room Form -->
        <div class="card p-3 mb-4 shadow-sm">
            <h4>Add New Room</h4>

            <input class="form-control mb-2" type="text" placeholder="Room Number">
            <input class="form-control mb-2" type="number" placeholder="Capacity">
            <input class="form-control mb-2" type="text" placeholder="Equipment (comma separated)">

            <button class="btn btn-warning">Add Room</button>
        </div>

        <!-- Rooms Table -->
        <div class="card p-3 shadow-sm">
            <h4>Available Rooms</h4>

            <table class="table table-striped mt-3">
                <thead class="table-warning">
                    <tr>
                        <th>Room Number</th>
                        <th>Capacity</th>
                        <th>Equipment</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>5</td>
                        <td>30</td>
                        <td>Projector, Whiteboard</td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>50</td>
                        <td>Computers, AC</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
    <!-- Navbar -->
    <nav class="navbar bg-light shadow-sm rounded">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand fw-bold m-0">
                Event Management System
            </span>
        </div>
    </nav>


        


</div>

</body>
</html>
